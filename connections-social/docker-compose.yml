# Connections Social - Docker Compose
# Databases in Docker, backend/frontend run locally
#
# Quick Start:
#   docker compose up -d
#   make backend   # in terminal 1
#   make frontend  # in terminal 2
#   make seed      # seed demo data

services:
  postgres:
    image: postgres:16-alpine
    container_name: connections-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-connections}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-connections}
      POSTGRES_DB: ${POSTGRES_DB:-connections}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-connections} -d ${POSTGRES_DB:-connections}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: connections-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
