---
# K8s Secret template — DO NOT commit with real values.
#
# Copy this file, fill in base64-encoded values, and apply to the cluster:
#   kubectl apply -f secrets.yaml -n connections
#
# Encode values:  echo -n 'my-value' | base64
# Decode values:  echo 'bXktdmFsdWU=' | base64 -d
#
# In production, use a secrets manager (AWS Secrets Manager, GCP Secret Manager,
# or HashiCorp Vault) with the CSI Secrets Store driver instead of committing
# secret YAML files — even encrypted ones.

apiVersion: v1
kind: Secret
metadata:
  name: connections-backend-secrets
  namespace: connections
  labels:
    app: connections-backend
type: Opaque
data:
  # postgresql://<user>:<password>@<host>:<port>/<db>
  DATABASE_URL: <base64-encoded-database-url>

  # redis://<host>:<port>/<db>
  REDIS_URL: <base64-encoded-redis-url>

  # API key for /admin and /ingest endpoints.
  # Generate with: python -c "import secrets; print(secrets.token_urlsafe(32))"
  # Leave empty (or omit) to disable auth in development.
  API_KEY: <base64-encoded-api-key>
